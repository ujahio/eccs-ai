name: Deploy Staging

on:
  push:
    branches:
      - staging

run-name: Deploy staging from ${{ github.ref_name }} by @${{ github.actor }}

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy staging
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    environment: staging
    env:
      AUTH_E2E_MODE: ""
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL || vars.NEXT_PUBLIC_APP_URL }}
      ECCS_EMAIL_SENDER: ${{ vars.ECCS_EMAIL_SENDER }}
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

    steps:
      - name: Validate stage configuration
        shell: bash
        run: |
          missing=()
          for name in AWS_ROLE_ARN AWS_REGION BETTER_AUTH_SECRET BETTER_AUTH_URL ECCS_EMAIL_SENDER NEXT_PUBLIC_APP_URL RESEND_API_KEY; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required GitHub Environment configuration for 'staging': ${missing[*]}"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # - name: Restore Bun & Next.js cache
      #   uses: actions/cache@v5
      #   with:
      #     path: |
      #       ~/.bun/install/cache
      #       ${{ github.workspace }}/.next/cache
      #     key: ${{ runner.os }}-bun-nextjs-${{ hashFiles('**/bun.lockb') }}-${{ hashFiles('**/*.{js,jsx,ts,tsx}') }}-v1
      #     restore-keys: |
      #       ${{ runner.os }}-bun-nextjs-

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: eccs-ai-staging-${{ github.run_id }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          action-timeout-s: 120

      - name: Deploy SST stage
        run: bunx sst deploy --stage staging --verbose --print-logs

      - name: Smoke image optimizer
        shell: bash
        run: |
          set +e

          image_url="${NEXT_PUBLIC_APP_URL%/}/_next/image?url=%2Fimages%2Flogo.png&w=256&q=75"
          echo "Requesting ${image_url}"
          status="$(curl -sS -o /tmp/image-optimizer-response -w "%{http_code}" "${image_url}")"
          echo "Image optimizer HTTP status: ${status}"
          echo "Image optimizer response body:"
          head -c 4000 /tmp/image-optimizer-response || true
          echo

          sleep 8

          function_name="$(aws lambda list-functions \
            --query 'Functions[?contains(FunctionName, `eccsfewebImageOptimizer`)].FunctionName | [0]' \
            --output text)"

          if [[ -z "${function_name}" || "${function_name}" == "None" ]]; then
            echo "::warning::Could not resolve image optimizer Lambda function name."
          else
            log_group="/aws/lambda/${function_name}"
            echo "Image optimizer Lambda: ${function_name}"
            echo "Recent image optimizer logs from ${log_group}:"
            aws logs tail "${log_group}" --since 10m --format short || true
          fi

          if [[ "${status}" -lt 200 || "${status}" -ge 400 ]]; then
            exit 1
          fi

      # - name: Save Bun & Next.js cache
      #   uses: actions/cache@v5
      #   with:
      #     path: |
      #       ~/.bun/install/cache
      #       ${{ github.workspace }}/.next/cache
      #     key: ${{ runner.os }}-bun-nextjs-${{ hashFiles('**/bun.lockb') }}-${{ hashFiles('**/*.{js,jsx,ts,tsx}') }}-v1
