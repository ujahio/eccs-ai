name: Deploy SST Stage

on:
  workflow_dispatch:
    inputs:
      stage:
        description: SST stage to deploy. The GitHub Environment name must match.
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

run-name: Deploy ${{ inputs.stage }} from ${{ github.ref_name }} by @${{ github.actor }}

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.stage }}
  cancel-in-progress: false

jobs:
  validate-target:
    name: Validate Target
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate selected stage
        shell: bash
        run: |
          case "${{ inputs.stage }}" in
            staging|production) ;;
            *)
              echo "::error::Unsupported SST stage '${{ inputs.stage }}'. Add it intentionally before deploying it."
              exit 1
              ;;
          esac

          if [[ "${{ inputs.stage }}" == "production" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Production deployments must run from main."
            exit 1
          fi

  deploy:
    name: Deploy ${{ inputs.stage }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - validate-target
    permissions:
      contents: read
      id-token: write
    environment: ${{ inputs.stage }}
    env:
      AUTH_E2E_MODE: ""
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL || vars.NEXT_PUBLIC_APP_URL }}
      ECCS_EMAIL_SENDER: ${{ vars.ECCS_EMAIL_SENDER }}
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      SST_STAGE: ${{ inputs.stage }}

    steps:
      - name: Validate stage configuration
        shell: bash
        run: |
          missing=()
          for name in AWS_ROLE_ARN AWS_REGION BETTER_AUTH_SECRET BETTER_AUTH_URL ECCS_EMAIL_SENDER NEXT_PUBLIC_APP_URL RESEND_API_KEY; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required GitHub Environment configuration for '$SST_STAGE': ${missing[*]}"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: eccs-ai-${{ inputs.stage }}-${{ github.run_id }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}

      - name: Deploy SST stage
        run: bunx sst deploy --stage "$SST_STAGE"
