name: Deploy Staging

on:
  push:
    branches:
      - staging
  pull_request:
    branches:
      - staging
    types:
      - labeled

run-name: Deploy staging from ${{ github.ref_name }} by @${{ github.actor }}

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy staging
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    environment: staging
    env:
      AUTH_E2E_MODE: ""
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL || vars.NEXT_PUBLIC_APP_URL }}
      ECCS_EMAIL_SENDER: ${{ vars.ECCS_EMAIL_SENDER }}
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

    steps:
      - name: Validate stage configuration
        shell: bash
        run: |
          missing=()
          for name in AWS_ROLE_ARN AWS_REGION BETTER_AUTH_SECRET BETTER_AUTH_URL ECCS_EMAIL_SENDER NEXT_PUBLIC_APP_URL RESEND_API_KEY; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required GitHub Environment configuration for 'staging': ${missing[*]}"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore Bun & Next.js cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-bun-nextjs-${{ hashFiles('**/bun.lockb') }}-${{ hashFiles('**/*.{js,jsx,ts,tsx}') }}-v1
          restore-keys: |
            ${{ runner.os }}-bun-nextjs-

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: eccs-ai-staging-${{ github.run_id }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          action-timeout-s: 120

      - name: Deploy SST stage
        run: bunx sst deploy --stage staging

      - name: Write deployment artifact
        if: ${{ always() }}
        shell: bash
        run: |
          mkdir -p artifacts
          {
            echo "# Staging Deployment"
            echo
            echo "- Workflow: $GITHUB_WORKFLOW"
            echo "- Run: $GITHUB_RUN_ID"
            echo "- Actor: $GITHUB_ACTOR"
            echo "- Event: $GITHUB_EVENT_NAME"
            echo "- Ref: ${GITHUB_REF_NAME:-unknown}"
            echo "- Requested deploy ref: $GITHUB_REF"
            echo "- Stage: staging"
            echo "- Reason: push-${GITHUB_REF_NAME:-unknown}"
            echo "- App URL: $NEXT_PUBLIC_APP_URL"
          } > artifacts/staging-deploy-summary.md

      - name: Upload deployment artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: staging-deploy-summary
          path: artifacts/staging-deploy-summary.md
          if-no-files-found: ignore
          retention-days: 14

      - name: Save Bun & Next.js cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-bun-nextjs-${{ hashFiles('**/bun.lockb') }}-${{ hashFiles('**/*.{js,jsx,ts,tsx}') }}-v1

  remove:
    name: Remove staging
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.label.name == 'remove-staging' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    environment: staging
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

    steps:
      - name: Validate remove configuration
        shell: bash
        run: |
          missing=()
          for name in AWS_ROLE_ARN AWS_REGION; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required GitHub Environment configuration for removing 'staging': ${missing[*]}"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: eccs-ai-remove-staging-${{ github.run_id }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          action-timeout-s: 120

      - name: Remove SST staging stage
        id: remove_staging
        run: bunx sst remove --stage staging

      - name: Write removal artifact
        if: ${{ always() }}
        shell: bash
        run: |
          mkdir -p artifacts
          {
            echo "# Staging Removal"
            echo
            echo "- Workflow: $GITHUB_WORKFLOW"
            echo "- Run: $GITHUB_RUN_ID"
            echo "- Actor: $GITHUB_ACTOR"
            echo "- Event: $GITHUB_EVENT_NAME"
            echo "- PR: #${{ github.event.pull_request.number }}"
            echo "- Ref: ${GITHUB_REF_NAME:-unknown}"
            echo "- Stage: staging"
            echo "- Remove step: ${{ steps.remove_staging.outcome }}"
          } > artifacts/staging-remove-summary.md

      - name: Upload removal artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: staging-remove-summary
          path: artifacts/staging-remove-summary.md
          if-no-files-found: ignore
          retention-days: 14
