name: Deploy Demo Stage

on:
  push:
    branches:
      - demo

run-name: Deploy demo from ${{ github.ref_name }} by @${{ github.actor }}

permissions:
  contents: read

concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy demo
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    environment: demo
    env:
      AUTH_E2E_MODE: ""
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL || vars.NEXT_PUBLIC_APP_URL }}
      ECCS_EMAIL_SENDER: ${{ vars.ECCS_EMAIL_SENDER }}
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      CASE_LIFECYCLE_DEMO_CONTROLS_ENABLED: ${{ vars.CASE_LIFECYCLE_DEMO_CONTROLS_ENABLED }}

    steps:
      - name: Validate stage configuration
        shell: bash
        run: |
          missing=()
          for name in AWS_ROLE_ARN AWS_REGION BETTER_AUTH_SECRET BETTER_AUTH_URL ECCS_EMAIL_SENDER NEXT_PUBLIC_APP_URL RESEND_API_KEY CASE_LIFECYCLE_DEMO_CONTROLS_ENABLED; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required GitHub Environment configuration for 'demo': ${missing[*]}"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore Bun & Next.js cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-bun-nextjs-${{ hashFiles('**/bun.lockb') }}-${{ hashFiles('**/*.{js,jsx,ts,tsx}') }}-v1
          restore-keys: |
            ${{ runner.os }}-bun-nextjs-

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: eccs-ai-staging-${{ github.run_id }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          action-timeout-s: 120

      - name: Deploy Demo SST stage
        run: bunx sst deploy --stage demo

      - name: Save Bun & Next.js cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-bun-nextjs-${{ hashFiles('**/bun.lockb') }}-${{ hashFiles('**/*.{js,jsx,ts,tsx}') }}-v1
